<script>
(function(){
'use strict';
var VERSION='prototype 4b (Form 1, Form 2, Email to office)';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var MEM={};
function lsGet(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return (k in MEM)?MEM[k]:d}
function lsSet(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}

/* ---------- data ---------- */
var SAMPLE=JSON.parse($('#sampleData').textContent);
var S={tab:'tanks',q:'',form:null,sheetFn:null,
  data:null,sample:false,entries:lsGet('ebp_entries',[]),adds:lsGet('ebp_adds',{}),draft:lsGet('ebp_draft',null)};
S.data=lsGet('ebp_data',null);
if(!S.data||!S.data.fields){S.data=SAMPLE;S.sample=true}
var F={};
function indexFields(){F={};S.data.fields.forEach(function(f){F[f.c]=f;
  if(f.list)f.list=f.list.filter(function(x){return String(x).trim()!==''&&String(x)!=='0'})})}
indexFields();
var PAGES=[{n:1,t:'Tank'},{n:2,t:'Inspections'},{n:3,t:'Hose'},{n:4,t:'Other'}];
var REQ_LABEL='Required';
/* fields the inspection forms keep up to date: never changed from the phone for an existing tank */
var VOL={G:1,J:1,K:1,M:1,P:1,Q:1,R:1,S:1,T:1,U:1,V:1,W:1,X:1,Y:1};

/* ---------- dates and validation (same rules as the workbook form) ---------- */
var MONTHS='janfebmaraprmayjunjulaugsepoctnovdec';
function monthFromName(t){t=String(t).toLowerCase().slice(0,3);if(t.length<3)return 0;var p=MONTHS.indexOf(t);return(p>=0&&p%3===0)?p/3+1:0}
function yearOf(v,d){if(d>2)return v;return v<=69?2000+v:1900+v}
function isNum(s){return /^\d+$/.test(s)}
function parseMY(s){
  var t=String(s).trim();if(!t)return null;
  t=t.replace(/[.\/\-,]/g,' ').replace(/\s+/g,' ').trim();
  var m=0,y=0,p,i;
  if(t.indexOf(' ')<0&&isNum(t)){
    switch(t.length){
      case 3:m=+t[0];y=yearOf(+t.slice(1),2);break;
      case 4:m=+t.slice(0,2);y=yearOf(+t.slice(2),2);break;
      case 5:m=+t[0];y=+t.slice(1);break;
      case 6:m=+t.slice(0,2);y=+t.slice(2);break;
      case 8:y=+t.slice(0,4);m=+t.slice(4,6);break;
      default:return null}
  }else{
    p=t.split(' ');var n=p.length;if(n<2||n>3)return null;
    var nm=0;
    for(i=0;i<n;i++){if(!isNum(p[i])){var mm=monthFromName(p[i]);if(!mm)return null;nm=mm}}
    if(nm){m=nm;var nums=p.filter(isNum);if(!nums.length)return null;var last=nums[nums.length-1];y=yearOf(+last,last.length)}
    else if(n===2){if(p[0].length===4){y=+p[0];m=+p[1]}else{m=+p[0];y=yearOf(+p[1],p[1].length)}}
    else{if(p[0].length===4){y=+p[0];m=+p[1]}else if(+p[0]<=12){m=+p[0];y=yearOf(+p[2],p[2].length)}else if(+p[1]<=12){m=+p[1];y=yearOf(+p[2],p[2].length)}else return null}
  }
  if(m<1||m>12||y<1900||y>2100)return null;
  return{m:m,y:y};
}
function parseYear(s){var t=String(s).trim();if(!isNum(t))return null;var y;if(t.length===2)y=yearOf(+t,2);else if(t.length===4)y=+t;else return null;return(y<1900||y>2100)?null:y}
function pad2(n){return(n<10?'0':'')+n}
function fmtMY(o){return pad2(o.m)+'-'+o.y}
function serial(d){return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5)}
function todaySerial(){return serial(new Date())}
function evalF(s){
  if(!s)return null;s=String(s).trim();var m;
  if((m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s)))return serial(new Date(+m[1],+m[2]-1,+m[3]));
  if((m=/^=TODAY\(\)\s*([+-]\s*\d+)?$/i.exec(s)))return todaySerial()+(m[1]?+m[1].replace(/\s/g,''):0);
  if((m=/^=YEAR\(TODAY\(\)\)\s*([+-]\s*\d+)?$/i.exec(s)))return new Date().getFullYear()+(m[1]?+m[1].replace(/\s/g,''):0);
  if(/^-?\d+(\.\d+)?$/.test(s))return +s;
  return null;
}
function cmp(v,op,a,b){
  var ok=true;
  switch(op){
    case 1:if(a!=null&&v<a)ok=false;if(b!=null&&v>b)ok=false;break;
    case 2:if(a!=null&&b!=null&&v>=a&&v<=b)ok=false;break;
    case 3:if(a!=null&&v!==a)ok=false;break;
    case 4:if(a!=null&&v===a)ok=false;break;
    case 5:if(a!=null&&!(v>a))ok=false;break;
    case 6:if(a!=null&&!(v<a))ok=false;break;
    case 7:if(a!=null&&!(v>=a))ok=false;break;
    case 8:if(a!=null&&!(v<=a))ok=false;break}
  return ok;
}
function keyOf(v){return(v.A||'')+'|'+(v.C||'')+'|'+(v.D||'')}
function allTanks(){
  var over={},out=[];
  var qm={};
  S.entries.forEach(function(e){if(e.kind==='quick'){if(!qm[e.row]||!qm[e.row].sent||e.sent===0)qm[e.row]=e}else if(e.row)over[e.row]=e});
  S.data.tanks.forEach(function(t){var e=over[t.row];out.push({row:t.row,v:e?e.v:t.v,key:keyOf(t.v),entry:e||null,q:qm[t.row]||null})});
  S.entries.forEach(function(e){if(!e.row&&e.kind!=='quick')out.push({row:0,v:e.v,key:'',entry:e,q:null})});
  return out;
}
function norm(s){return String(s||'').trim().toLowerCase()}
/* returns {msg, value, note} for one field */
function check(c,raw,form){
  var f=F[c],v=String(raw==null?'':raw).trim(),res={value:v,msg:'',note:''};
  if(!v){if(f.req)res.msg=f.label+' is needed.';return res}
  if(form.orig&&norm(form.orig[c])===norm(v))return res;
  var val=f.val;
  if(f.kind==='M'){
    var o=parseMY(v);
    if(!o){res.msg='Could not read that date. Type it like 10-2026, 10/26 or 1026.';return res}
    res.value=fmtMY(o);
    if(val&&val.t===4){var sd=serial(new Date(o.y,o.m-1,1));if(!cmp(sd,val.op,evalF(val.f1),evalF(val.f2)))res.msg=val.m||(f.label+' is outside the allowed date range.')}
    return res;
  }
  if(f.kind==='Y'){
    var y=parseYear(v);
    if(y==null){res.msg='Enter the year only, for example 2019.';return res}
    res.value=String(y);
    if(val){var ok=val.t===4?cmp(y,val.op,evalF(val.f1),evalF(val.f2)):cmp(y,val.op,evalF(val.f1),evalF(val.f2));if(!ok)res.msg=val.m||(f.label+' is outside the allowed range.')}
    return res;
  }
  if(val&&(val.t===1||val.t===2)){
    var okfmt=val.t===1?/^-?\d+$/.test(v):/^-?\d+(\.\d+)?$/.test(v);
    if(!okfmt||!cmp(+v,val.op,evalF(val.f1),evalF(val.f2))){res.msg=val.m||('Number in '+f.label+' is not allowed.')}
    return res;
  }
  if(c==='AB'){
    var dup=allTanks().some(function(t){if(form.row&&t.row===form.row)return false;if(t.entry&&t.entry.id===form.id)return false;return norm(t.v.AB)===norm(v)});
    if(dup)res.msg=(val&&val.m)||'You have entered a duplicate number.  Please correct.';
    return res;
  }
  if(c==='D'){
    var A=form.v.A,C=form.v.C;
    var d2=allTanks().some(function(t){if(form.row&&t.row===form.row)return false;if(t.entry&&t.entry.id===form.id)return false;return norm(t.v.A)===norm(A)&&norm(t.v.C)===norm(C)&&norm(t.v.D)===norm(v)});
    if(d2)res.note='A tank with this number is already listed for this location and company (twin or triple?). It will be added as a further tank.';
    return res;
  }
  if(c==='A'&&f.combo&&!f.open){
    var inl=(f.list||[]).some(function(x){return norm(x)===norm(v)});
    if(!inl&&!(form.keepA&&norm(form.keepA)===norm(v)))res.msg='Pick the Location from the list. New locations are added in the workbook first.';
    return res;
  }
  return res;
}
function validateAll(form){
  var errs={},notes={},vals={};
  S.data.fields.forEach(function(f){var r=check(f.c,form.v[f.c],form);if(r.value)vals[f.c]=r.value;if(r.msg)errs[f.c]=r.msg;if(r.note)notes[f.c]=r.note});
  return{errs:errs,notes:notes,vals:vals};
}

/* ---------- rules for a new drop-down choice (same as the workbook's "+ Add new") ---------- */
function sizeCanon(t){
  var m=/^([0-9.,]+)\s*(.*)$/.exec(String(t).trim());if(!m||!m[1]||!m[2])return '';
  var u=m[2].toLowerCase().trim(),map={'usg':'USG','us gal':'USG','usgal':'USG','us gallons':'USG','gal':'USG','imp':'IMP','imp gal':'IMP','imp.':'IMP',
    'litres':'litres','litre':'litres','liters':'litres','liter':'litres','l':'litres','lt':'litres','m3':'m3','cu.ft.':'cu.ft.','cu.ft':'cu.ft.','cu ft':'cu.ft.','cuft':'cu.ft.','ft3':'cu.ft.'};
  return map[u]?m[1]+' '+map[u]:'';
}
function newChoiceCheck(c,text){
  var t=String(text).replace(/[\t\u00a0]/g,' ').replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').trim();
  if(!t)return{msg:'Please type the new choice.'};
  if(t.length>60)return{msg:'That is too long for a drop-down choice (the limit is 60 characters).'};
  if(/^[=+\-@]/.test(t))return{msg:'A choice cannot start with '+t[0]+'. Please type it without that character.'};
  if(/^\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?$/.test(t))return{msg:'Excel would read that as a date. Please add its unit or an extra word, for example 3/4" instead of 3/4.'};
  if(c==='AD'){var z=sizeCanon(t);if(!z)return{msg:'A tank size needs a number and its unit, for example 1500 USG or 4600 litres.'};t=z}
  if(c==='AG'&&!/^[0-9]/.test(t))return{msg:'A tank diameter starts with the number, for example 41" or 1029 mm.'};
  return{value:t};
}

/* ---------- lists ---------- */
function listFor(c){
  var f=F[c],base=(f.list||[]).slice(),adds=(S.adds[c]||[]).filter(function(a){return!base.some(function(b){return norm(b)===norm(a)})});
  return{base:base,adds:adds};
}
function noteAdd(c,v){
  var f=F[c];if(!f||!f.combo||!f.open||!v)return;
  var L=listFor(c);
  if(L.base.concat(L.adds).some(function(x){return norm(x)===norm(v)}))return;
  S.adds[c]=(S.adds[c]||[]).concat([v]);lsSet('ebp_adds',S.adds);
}
function companiesAt(loc){
  var seen={},out=[];
  allTanks().forEach(function(t){if(norm(t.v.A)===norm(loc)&&t.v.C&&!seen[norm(t.v.C)]){seen[norm(t.v.C)]=1;out.push(t.v.C)}});
  return out;
}

/* ---------- UI helpers ---------- */
var toastT=0;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}
function openSheet(html,after){
  var w=$('#sheetWrap');w.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  w.hidden=false;
  w.onclick=function(e){if(e.target===w)closeSheet()};
  if(after)after(w);
}
function closeSheet(){var w=$('#sheetWrap');w.hidden=true;w.innerHTML=''}
function chev(){return '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function tankIcon(){return '<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="9" width="28" height="14" rx="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v14M20 9v14" stroke="currentColor" stroke-width="2" opacity=".6"/><path d="M16 9V5m-3 0h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'}

/* ---------- rendering ---------- */
function unsent(){return S.entries.filter(function(e){return!e.sent})}
function render(){
  if(S.f2v){if(S.f2v.view==='f2')renderF2();else renderRep();return}
  if(S.form){renderForm();return}
  var top=$('#top');
  var ts=S.data.made||'';
  top.innerHTML=tankIcon()+'<div class="grow"><h1>eB620 Tank Data</h1><p>'+(S.sample?'Example data - ':'')+S.data.tanks.length+' tanks'+(ts?' - data from '+esc(ts):'')+'</p></div>';
  var n=unsent().length+f2unsent().length;
  var tabs=$('#tabs');tabs.hidden=false;
  tabs.innerHTML=[['tanks','Tanks',0],['send','To send',n],['data','Data',0]].map(function(t){
    return '<button type="button" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[2]?'<span class="n">'+t[2]+'</span>':'')+'</button>'}).join('');
  $('#fab').hidden=S.tab!=='tanks';
  if(S.tab==='tanks')renderTanks();else if(S.tab==='send')renderSend();else renderData();
}
function tankRow(t){
  var v=t.v,badge='';
  if(t.entry){badge=t.entry.sent?'<span class="badge good">Sent</span>':(t.row?'<span class="badge warn">Changed</span>':'<span class="badge warn">New</span>')}
  else if(t.q){badge=t.q.sent?'<span class="badge good">Update sent</span>':'<span class="badge warn">Update</span>'}
  var sub=[v.A,v.C].filter(Boolean).join(' - ');
  var sub2=[v.AD,v.AF,v.AE].filter(Boolean).join(' - ');
  return '<li><button type="button" class="tank" data-open="'+(t.row?'r:'+t.row:'e:'+esc(t.entry.id))+'"><span class="tag">'+esc(v.D||'(no number)')+'</span>'+(badge||'<span></span>')+'<span class="sub">'+esc(sub)+'</span><span></span>'+(sub2?'<span class="sub">'+esc(sub2)+'</span>':'')+'</button></li>';
}
function matches(t,q){
  if(!q)return true;
  var hay=[t.v.A,t.v.C,t.v.D,t.v.AB,t.v.E,t.v.AD,t.v.AF].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){return hay.indexOf(w)>=0});
}
function natural(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}
function renderTanks(){
  var h='';
  if(S.draft){h+='<div class="banner"><b>Unfinished entry.</b> '+esc(S.draft.mode==='quick'?'A quick update':(S.draft.v.D?('Tank '+S.draft.v.D):'A new tank'))+(S.draft.v.A?' at '+esc(S.draft.v.A):'')+' was not saved.<div class="row"><button class="btn primary sm" data-act="resume" type="button">Continue</button><button class="btn sm" data-act="dropdraft" type="button">Discard</button></div></div>'}
  if(S.sample){h+='<div class="banner"><b>Example data.</b> These are the sample tanks from the template. Open the Data tab and load the file exported from the workbook to see your own tanks.</div>'}
  h+='<div class="search"><input id="q" type="search" placeholder="Search location, company, tank or serial number" value="'+esc(S.q)+'" autocomplete="off" aria-label="Search tanks"></div><div class="count" id="cnt"></div><ul class="list" id="tl"></ul>';

    return;
  }
  var ed=t.closest('[data-edit]');if(ed){openEntry(ed.getAttribute('data-edit'));return}
  var de=t.closest('[data-del]');
  if(de){
    var id=de.getAttribute('data-del');
    if(de.getAttribute('data-armed')){S.entries=S.entries.filter(function(x){return x.id!==id});lsSet('ebp_entries',S.entries);render();toast('Deleted from this phone.')}
    else{de.setAttribute('data-armed','1');de.textContent='Tap again to delete';setTimeout(function(){if(de.isConnected){de.removeAttribute('data-armed');de.textContent='Delete'}},3000)}
    return;
  }
  var us=t.closest('[data-unsend]');if(us){var id2=us.getAttribute('data-unsend');S.entries.forEach(function(x){if(x.id===id2)x.sent=0});lsSet('ebp_entries',S.entries);render();return}
  var ac=t.closest('[data-act]');
  if(ac){
    var a=ac.getAttribute('data-act');
    if(a==='resume'){
      if(S.draft.mode==='quick'){var bt=baseTank(S.draft.row);if(bt){openQuick(bt,null);Object.assign(S.form,{id:S.draft.id,v:S.draft.v,hose:!!S.draft.hose,dirty:true});renderForm()}}
      else openForm({id:S.draft.id,row:S.draft.row,key:S.draft.key,v:S.draft.v,dirty:true})}
    if(a==='dropdraft'){dropDraft();render()}
    return;
  }
  if(t.closest('#sendBtn')){sendNow();return}
  if(t.closest('#loadBtn')){$('#fileIn').click();return}
  if(t.closest('#clearSent')){
    var b=t.closest('#clearSent');
    if(b.getAttribute('data-armed')){S.entries=S.entries.filter(function(x){return!x.sent});lsSet('ebp_entries',S.entries);render();toast('Sent tanks removed.')}
    else{b.setAttribute('data-armed','1');b.textContent='Tap again to remove';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent='Remove sent tanks from this phone'}},3000)}
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='hoseNew'&&S.form){S.form.hose=e.target.checked;S.form.dirty=true;saveDraft();renderForm();return}
  if(e.target.id==='fileIn'&&e.target.files&&e.target.files[0]){
    var file=e.target.files[0],r=new FileReader();
    r.onload=function(){loadDataText(String(r.result),file.name)};
    r.onerror=function(){toast('That file could not be opened.')};
    r.readAsText(file);e.target.value='';
  }
});
document.addEventListener('input',function(e){
  var fc=e.target.getAttribute&&e.target.getAttribute('data-f2c');
  if(fc&&S.f2v){var a=S.f2v.items[+fc]||(S.f2v.items[+fc]={});a.c=e.target.value;f2save();var rf=f2refs(S.f2v.items);return}
  var c=e.target.getAttribute&&e.target.getAttribute('data-in');
  if(c&&S.form){S.form.v[c]=e.target.value;S.form.dirty=true;saveDraft()}
});
document.addEventListener('focusout',function(e){
  var c=e.target.getAttribute&&e.target.getAttribute('data-in');
  if(c&&S.form)blurField(c);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-in')&&S.form){
    e.preventDefault();var els=[].slice.call(document.querySelectorAll('.fields input,.fields .pick'));var i=els.indexOf(e.target);
    if(i>=0&&els[i+1])els[i+1].focus();else e.target.blur();return}
  if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet();
});
function baseTank(row){return S.data.tanks.filter(function(x){return x.row===row})[0]}
function openRow(row){
  var t=baseTank(row);if(!t)return;
  var q=S.entries.filter(function(e){return e.kind==='quick'&&e.row===row&&!e.sent})[0];
  openQuick(t,q);
}
function openFull(row){
  var t=baseTank(row);if(!t)return;
  var e=S.entries.filter(function(x){return x.kind!=='quick'&&x.row===row})[0];
  openForm({id:e?e.id:null,row:t.row,key:keyOf(t.v),v:e?e.v:t.v});
}
function openQuick(t,q){
  var v=q?Object.assign({},q.q,{note:q.note||''}):{};
  S.form={mode:'quick',orig:t.v,id:q?q.id:newId(),row:t.row,key:keyOf(t.v),v:v,hose:q?!!q.hose:false,errs:{},notes:{},dirty:false,page:1,keepA:t.v.A};
  window.scrollTo(0,0);render();
}
var QLAB={R:'PRV expires',S:'PRV psi @ temp',V:'Hose expiry year',X:'Hose length (ft)',Y:'Hose MFG',Z:'HRV expires',AA:'Paint rating (0 - 10)'};
function quickSummary(e){
  var q=e.q||{},p=[];
  ['R','S','Z','AA'].forEach(function(c){if(q[c])p.push(QLAB[c]+' '+q[c])});
  if(e.hose){var h=['V','X','Y'].map(function(c){return q[c]}).filter(Boolean);p.push('New hose'+(h.length?' ('+h.join(', ')+')':''))}
  if(e.note)p.push('Note: '+e.note);
  return p.join(' - ')||'No changes';
}
function openEntry(id){
  var e=S.entries.filter(function(x){return x.id===id})[0];if(!e)return;
  if(e.kind==='quick'){var bt=baseTank(e.row);if(bt)openQuick(bt,e);return}
  if(e.sent&&!e.row){toast('This tank was already sent. Change it in the workbook.');return}
  openForm({id:e.id,row:e.row,key:e.key,v:e.v});
}
render();
/* works offline when the page is hosted: the service worker keeps a copy */
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]')){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
window.__ebp={S:S,buildTSV:buildTSV,parseMY:parseMY,check:check};
})();
</script>
