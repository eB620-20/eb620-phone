d import from workbook v113). Earlier: 9a (the type filter is always shown, greyed out when empty; DUs are no longer on the Multi-Hose test; their hoses are tested with the annual inspection; the Hide hydro due filter is gone, a Nurse / MSV filter replaces it, and Remove from this test says hydro/VK). Earlier: 8x (the Multi-Hose test has Send results: a report file for the office with Pass / Fail and new hose details; MSV vessels can get another hose with Add another hose). Earlier: 8w (the Multi-Hose test also lists the hoses of MSVs - main storage vessels - from the workbook export; they have no hydro tag and no Remove from this test). Earlier: 8v (a scanned serial that is not in the list now offers New tank / New DU with the serial filled in; Done on Forms 2a, 6 and 7 and Send ask about a No without a comment, like Form 2); 8u (Multi-Hose test: units due for a hydro are left out of the list (their hose is tested with the hydro), with 30 / 60 / 90 days, and any hose can be removed from the test and put back); 8t (new Multi-Hose test on the Tanks page: pick a location, go down its hoses with Pass / Fail, new-hose details on a fail, a note, and Scan a QR label to jump to a tank; prototype, results stay on the phone and are not sent yet); 8s (the Due chip on the Tanks page now reads Hydro due, short enough to stay on one line beside the 30 / 60 / 90 day chips); 8q (on a twin or triple tile the Report sent badge now sits left of the word Twin / Triple, so the right-hand edge of every tile shows the unit type or description); 8p (All details now says "open for Edit button", with a line "Scroll to the bottom for the Edit button" above the list); 8n (Next annual visual and Next hydro are also shown in the top block under the serial number, as well as after the last dates in All details); 8m (Next annual visual and Next hydro now sit in the All details list right after Last visual and Last hydro, not at the top); 8k (Next annual visual is worked out as last visual + 12 mo /* a Sent badge on a tile is shown for 30 days after the send (SENT_DAYS); older marks are only hidden on the tiles, the entry itself is not changed */
var SENT_DAYS=30;
function sentFresh(x){return !!x&&(x<1e12||Date.now()-x<SENT_DAYS*864e5)}
function repBadge(key){
  var rec=S.f2.filter(function(r){return r.key===key}).sort(function(a,b){return (b.ts||0)-(a.ts||0)})[0];
  if(!rec)return null;
  if(!rec.sent)return {ts:Date.now(),h:'<span class="badge warn">Report</span>'};
  return sentFresh(rec.sent)?{ts:rec.sent,h:'<span class="badge good">Report sent</span>'}:null;
}
/* the tile shows ONE badge: the most recent of details / quick update / inspection report (unsent ones count as now); noRep = a twin / triple tank row, its report badge sits on the unit heading instead */
function tankBadge(t,noRep){
  var c=[],now=Date.now(),e,rb;
  if(t.entry){e=t.entry;if(e.sent){if(sentFresh(e.sent))c.push({ts:e.sent,h:'<span class="badge good">Details sent</span>'})}else c.push({ts:now,h:'<span class="badge warn">'+(t.row?'Changed':'New')+'</span>'})}
  else if(t.q){if(t.q.sent){if(sentFresh(t.q.sent))c.push({ts:t.q.sent,h:'<span class="badge good">Update sent</span>'})}else c.push({ts:now,h:'<span class="badge warn">Update</span>'})}
  if(!noRep){rb=repBadge(keyOf(t.v));if(rb)c.push(rb)}
  c.sort(function(a,b){return b.ts-a.ts});
  return c.length?c[0].h:'';
}
function tid(t){return t.row?'r'+t.row:'e'+(t.entry?t.entry.id:'')}
function tankOpenKey(t){return t.row?'r:'+t.row:'e:'+esc(t.entry.id)}
/* ---- tanks due for a hydro (nurse: column N; DU: column O date and N status, both exported by the workbook as "due" / "dst") ---- */
function dueDays(){return S.dueDays===60||S.dueDays===90?S.dueDays:30}
function dueDate(x){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||''));return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():null}
function dueOf(t,du){
  if(!t||(!t.due&&!t.dst))return null;
  var n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),win=dueDays();
  var dt=dueDate(t.due),st=String(du?(t.dst||''):(t.due||'')).trim().toUpperCase(),k='',r=9;
  if(du&&st==='EXP'){k='red';r=0}
  else if(st==='DUE'){k='red';r=(dt!==null&&dt<today)?0:1}
  else if(dt!==null){var d=Math.round((dt-today)/864e5);if(d<0){k='red';r=0}else if(d<=win){k='blue';r=2}}
  if(!k&&du&&/MNTH/.test(st)&&win>=60){k='blue';r=2}
  return k?{k:k,r:r,ts:dt===null?9e12:dt}:null;
}
/* a DU unit can be two rows (quad): the most urgent row counts */
function dueUnit(t){var best=null;tduUnitRows(t.v).forEach(function(x){var d=dueOf(x,true);if(d&&(!best||d.r<best.r||(d.r===best.r&&d.ts<best.ts)))best=d});return best}
function dueSort(a,b){return a.r-b.r||a.ts-b.ts}

function dueNote(t,du,d){

  return txt?'<span class="dn '+d.k+'">'+esc(txt)+'</span>':'';
}
/* one tile per unit (location + company + unit number): a single tank looks like a card, a twin or triple has a slim row per tank (L / C / R) */

  var h='<div class="panel"><h2>Tank and drop-down data</h2><dl class="kv"><dt>Source</dt><dd>'+(S.sample?'Example data built into this page':esc(D.book||'Workbook'))+'</dd><dt>Exported</dt><dd>'+esc(D.made||'-')+'</dd><dt>Tanks</dt><dd>'+D.tanks.length+'</dd>'+(D.tdu&&D.tdu.tanks?'<dt>DU rows</dt><dd>'+D.tdu.tanks.length+'</dd>':'')+'<dt>Fields</dt><dd>'+D.fields.length+'</dd></dl>'+
    '<p>In the workbook, click the "Export for phone" tile on the Welcome menu. Send the file it saves to this phone, then load it here. Loading new data does not delete tanks that are waiting to send.</p>'+
    '<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden><button class="btn primary block" id="loadBtn" type="button">Load data file</button></div>';
  h+='<div class="panel"><h2>On this phone</h2><dl class="kv"><dt>Waiting to send</dt><dd>'+(unsent().length+tduUnsent().length)+'</dd><dt>Sent</dt><dd>'+(S.entries.filter(function(e){return e.sent}).length+S.tdue.filter(function(e){return e.sent}).length)+'</dd><dt>Version</dt><dd>'+VERSION+'</dd></dl><p>Everything on this page works with no signal. Entries stay on the phone until you delete them.</p>'+
    '<button class="btn danger block" id="clearSent" type="button">Remove sent tanks from this phone</button></div>';
  $('#view').innerHTML=h;
}

/* ---------- form ---------- */
function newId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function openForm(opts){
  var orig=null,kind=opts.kind==='tdu'?'tdu':'nurse';
  if(opts.row){(kind==='tdu'?tduBaseRows():S.data.tanks).forEach(function(t){if(t.row===opts.row)orig=t.v})}
  S.form={kind:kind,orig:orig,id:opts.id||newId(),row:opts.row||0,key:opts.key||'',v:Object.assign({},opts.v||{}),isNew:!opts.row,page:1,errs:{},notes:{},show:false,dirty:!!opts.dirty,keepA:(opts.v&&opts.v.A)||''};
  window.scrollTo(0,0);render();
}
function saveDraft(){
  var f=S.form;if(!f)return;
  S.draft={kind:f.kind||'nurse',id:f.id,row:f.row,key:f.key,v:f.v,mode:f.mode||'',hose:!!f.hose};lsSet('ebp_draft',S.draft);
}
function dropDraft(){S.draft=null;lsDel('ebp_draft')}
function renderForm(){
  if(S.form.mode==='quick'){renderQuick();return}
  var f=S.form,t=$('#top');
  $('#tabs').hidden=true;$('#fab').hidden=true;
  var tdu=f.kind==='tdu';
  var title=tdu?(f.v.D?('DU '+f.v.D):(f.isNew?'New DU':'DU')):(f.v.D?('Unit '+f.v.D):(f.isNew?'New tank':'Tank'));
  t.innerHTML='<button class="hbtn icon" id="backBtn" type="button" aria-label="Back">&#8249;</button><div class="grow"><h1>'+esc(title)+'</h1><p>'+esc([f.v.A,f.v.C].filter(Boolean).join(' - ')||(f.isNew?'Not saved yet':''))+'</p></div><button class="hbtn solid" id="saveBtn" type="button">Save</button>';
  var steps='<div class="steps" role="tablist">'+PG().map(function(p){
    var bad=FL().some(function(x){return x.page===p.n&&f.errs[x.c]});
    return '<button type="button" role="tab" data-page="'+p.n+'"'+(f.page===p.n?' aria-current="step"':'')+'>'+p.t+(bad?'<span class="dot" aria-label="needs attention"></span>':'')+'</button>'}).join('')+'</div>';
  var fields=FL().filter(function(x){return x.page===f.page}).map(fieldHtml).join('');
  var last=f.page===PG().length;
  var pager='<div class="pager">'+(f.page>1?'<button class="btn" data-go="'+(f.page-1)+'" type="button">&#8592; '+PG()[f.page-2].t+'</button>':'')+
    (last?'<button class="btn primary" id="saveBtn2" type="button">'+(tdu?'Save unit':'Save tank')+'</button>':'<button class="btn primary" data-go="'+(f.page+1)+'" type="button">'+PG()[f.page].t+' &#8594;</button>')+'</div>';
  if(tdu&&last&&!f.row)pager+='<div class="pager"><button class="btn block" id="saveRear" type="button">Save, then add the rear row (quad DU)</button></div>';
  var ronote=(f.row&&(f.page===2||f.page===3))?'<div class="banner" style="background:var(--surface);border-color:var(--line)">These dates, PRV and hose details are normally kept up to date by the inspection forms. Change one only to correct it (for example a wrong date or serial number). The office list shows the old and the new value.</div>':'';
  $('#view').innerHTML=steps+ronote+'<div class="fields">'+fields+'</div>'+pager;
}

function showExample(c){
  var e=EXAMPLES[c];if(!e)return;
  openSheet('<h2>Example: '+esc(e.t)+'</h2><div style="text-align:center;margin:.6rem 0"><img src="'+e.i+'" alt="Example picture of '+esc(e.t)+'" style="width:min(70%,260px);height:auto;border-radius:.6rem;border:1px solid var(--line)"></div><p style="margin:0;color:var(--muted)">'+esc(e.d)+'</p><div class="row" style="margin-top:.8rem"><button class="btn primary" id="exOk" type="button">Close</button></div>',function(){$('#exOk').onclick=closeSheet});
}
function fieldHtml(x){
  var f=S.form,c=x.c,v=f.v[c]||'',err=f.errs[c],note=f.notes[c];
  var lab='<label for="f_'+c+'">'+esc((f.mode==='quick'&&QLAB[c])||flab(x))+'</label>';
  if(EXAMPLES[c]&&f.kind!=='tdu')lab='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:.6rem">'+lab+'<button type="button" class="lnk" data-example="'+c+'">see example</button></div>';
  var ctl;
  if(x.combo){
    ctl='<button type="button" class="pick" id="f_'+c+'" data-pick="'+c+'"><span class="'+(v?'':'ph')+'">'+esc(v||(x.req?'Required':'Choose'))+'</span>'+chev()+'</button>';
  }else{
    var im=x.kind==='M'||x.kind==='Y'?'numeric':(x.val&&x.val.t===1?'numeric':(x.val&&x.val.t===2?'decimal':'text'));
    ctl='<input type="text" id="f_'+c+'" data-in="'+c+'" value="'+esc(v)+'" inputmode="'+im+'" autocomplete="off" autocapitalize="off" enterkeyhint="next"'+(x.kind==='M'?' placeholder="'+(x.req?'Required - ':'')+'mm-yyyy, e.g. 1026"':(x.kind==='Y'?' placeholder="'+(x.req?'Required - ':'')+'yyyy"':(x.req?' placeholder="Required"':'')))+'>';
  }
  var hint='';
  if(f.mode==='quick'){var ov=f.orig[c];hint='<div class="hint">On the sheet: '+esc(ov||'nothing')+'</div>'}
  return '<div class="field'+(err?' bad':'')+'" id="w_'+c+'">'+lab+ctl+hint+(err?'<div class="msg" role="alert">'+esc(err)+'</div>':'')+(note&&!err?'<div class="note">'+esc(note)+'</div>':'')+'</div>';
}
function setField(c,val,rerender){
  var f=S.form;f.v[c]=val;f.dirty=true;saveDraft();
  if(rerender)renderForm();
}
function refreshField(c){
  var f=S.form,w=$('#w_'+c);if(!w)return;
  var x=FM()[c],h=fieldHtml(x);
  var tmp=document.createElement('div');tmp.innerHTML=h;
  w.className=tmp.firstChild.className;
  var m=w.querySelectorAll('.msg,.note');for(var i=0;i<m.length;i++)m[i].remove();
  var add=tmp.firstChild.querySelectorAll('.msg,.note');for(i=0;i<add.length;i++)w.appendChild(add[i]);
}
function blurField(c){
  var f=S.form,x=FM()[c];if(!x)return;
  var r=check(c,f.v[c],f);
  if(x.kind==='M'||x.kind==='Y'||c==='B')f.v[c]=r.value;
  if(r.msg)f.errs[c]=r.msg;else delete f.errs[c];
  if(r.note)f.notes[c]=r.note;else delete f.notes[c];
  var el=$('#f_'+c);if(el&&el.tagName==='INPUT')el.value=f.v[c]||'';
  saveDraft();refreshField(c);
  if(c==='D'||c==='A'||c==='C'){var d=check('D',f.v.D,f);if(d.note)f.notes.D=d.note;else delete f.notes.D;refreshField('D')}
}
/* picker */
function openPicker(c){
  var f=S.form,x=FM()[c],cur=f.v[c]||'';
  var L=listFor(c),items=[],grpAt=[];
  if(c==='C'&&f.v.A){var here=companiesAt(f.v.A);
    var top=here.filter(function(h){return L.base.concat(L.adds).some(function(b){return norm(b)===norm(h)})||true});
    var seen={};top.forEach(function(t){seen[norm(t)]=1});
    items=[{g:'At '+f.v.A}].concat(top.map(function(t){return{v:t}}));
    var rest=L.adds.concat(L.base).filter(function(b){return!seen[norm(b)]});
    if(rest.length)items=items.concat([{g:'All companies'}]).concat(rest.map(function(t){return L.adds.indexOf(t)>=0?{v:t,s:'added on this phone'}:{v:t}}));
    if(!top.length)items=rest.map(function(t){return L.adds.indexOf(t)>=0?{v:t,s:'added on this phone'}:{v:t}});
  }else{
    items=L.adds.map(function(t){return{v:t,s:'added on this phone'}}).concat(L.base.map(function(t){return{v:t}}));
  }
  var rmAsk='';
  function draw(q){
    var ql=q.trim().toLowerCase(),html='',exact=false,any=0,pending='';
    items.forEach(function(it){
      if(it.g){pending='<div class="grp">'+esc(it.g)+'</div>';return}
      if(ql&&it.v.toLowerCase().indexOf(ql)<0)return;
      if(norm(it.v)===ql)exact=true;
      if(pending){html+=pending;pending=''}
      any++;
      if(it.s&&rmAsk===it.v){html+='<div class="opt" style="flex:none;flex-wrap:wrap;height:auto;padding:.5rem .7rem"><span style="flex:1 1 100%">Remove &#8220;'+esc(it.v)+'&#8221; from this list?</span><button type="button" class="btn" data-rmyes="'+esc(it.v)+'">Yes, remove</button><button type="button" class="btn" data-rmno="1">No</button></div>';return}
      html+='<div class="optrow" style="flex:none;display:flex;align-items:center;gap:.3rem"><button type="button" class="opt" style="flex:1" role="option" data-val="'+esc(it.v)+'" aria-selected="'+(norm(it.v)===norm(cur))+'"><span>'+esc(it.v)+'</span>'+(it.s?'<span class="small">'+esc(it.s)+'</span>':'')+'</button>'+(it.s?'<button type="button" class="btn" style="min-height:2.2rem;padding:0 .7rem;color:var(--bad)" data-rm="'+esc(it.v)+'" aria-label="Remove '+esc(it.v)+' from the list">Remove</button>':'')+'</div>';
    });
    var addTxt=x.site?(c==='A'?'as a new location':'as a new company'):'to the list';
    if(x.open&&ql&&!exact)html='<button type="button" class="opt add" data-add="'+esc(q.trim())+'"><span>+ Add &#8220;'+esc(q.trim())+'&#8221; '+addTxt+'</span></button>'+html;
    if(!any&&!(x.open&&ql))html+='<div class="empty">'+(x.site?'No match. Type the '+(c==='A'?'new location':'new company')+' above and tap Add.':(x.open?'Nothing in the list yet. Type the new choice above.':'No match. Pick from the list.'))+'</div>';
    if(cur)html+='<button type="button" class="opt" data-val="" style="color:var(--bad)"><span>Clear this field</span></button>';
    $('#plist').innerHTML=html;
  }
  openSheet('<h2>'+esc(x.label)+'</h2><input type="search" id="pq" placeholder="'+(x.site?(c==='A'?'Search, or type a new location':'Search, or type a new company'):x.open?'Search, or type a new choice':'Search')+'" autocomplete="off" autocapitalize="off"><div class="plist" id="plist" role="listbox"></div>',function(){
    draw('');
    $('#pq').addEventListener('input',function(e){draw(e.target.value)});
    $('#pq').addEventListener('keydown',function(e){if(e.key==='Enter'){var a=$('#plist .opt.add')||$('#plist .opt[data-val]');if(a)a.click()}});
    $('#plist').addEventListener('click',function(e){
      var rb=e.target.closest('[data-rm],[data-rmyes],[data-rmno]');
      if(rb){
        var old=$('#pmsg');if(old)old.remove();
        if(rb.hasAttribute('data-rmno')){rmAsk='';draw($('#pq').value);return}
        if(rb.hasAttribute('data-rm')){
          var rv=rb.getAttribute('data-rm'),use=choiceUsedBy(c,rv);
          if(use){$('#plist').insertAdjacentHTML('beforebegin','<div class="msg" id="pmsg" role="alert" style="color:var(--bad);font-size:.88rem">Cannot remove &#8220;'+esc(rv)+'&#8221;: '+esc(use)+' still uses it. Change or delete that entry first.</div>');return}
          rmAsk=rv;draw($('#pq').value);return}
        var gone=rb.getAttribute('data-rmyes');removeChoice(c,gone);items=items.filter(function(it){return!(it.s&&norm(it.v)===norm(gone))});rmAsk='';draw($('#pq').value);return}
