    else{if(p[0].length===4){y=+p[0];m=+p[1]}else if(+p[0]<=12){m=+p[0];y=yearOf(+p[2],p[2].length)}else if(+p[1]<=12){m=+p[1];y=yearOf(+p[2],p[2].length)}else return null}

function cmp(v,op,a,b){
  var ok=true;

    case 2:if(a!=null&&b!=null&&v>=a&&v<=b)ok=false;break;
    case 3:if(a!=null&&v!==a)ok=false;break;
    case 4:if(a!=null&&v===a)ok=false;break;
    case 5:if(a!=null&&!(v>a))ok=false;break;
    case 6:if(a!=null&&!(v<a))ok=false;break;
    case 7:if(a!=null&&!(v>=a))ok=false;break;
    case 8:if(a!=null&&!(v<=a))ok=false;break}

function check(c,raw,form){
  var f=FM()[c],v=String(raw==null?'':raw).trim(),res={value:v,msg:'',note:''};
  if(!v){if(f.req)res.msg=f.label+' is needed.';return res}
  if(form.orig&&norm(form.orig[c])===norm(v))return res;
  var val=f.val;
  if(f.kind==='M'){
    var o=parseMY(v);
    if(!o){res.msg='Could not read that date. Type it like 10-2026, 10/26 or 1026.';return res}
    res.value=fmtMY(o);
    if(val&&val.t===4){var sd=serial(new Date(o.y,o.m-1,1));if(!cmp(sd,val.op,evalF(val.f1),evalF(val.f2)))res.msg=val.m||(f.label+' is outside the allowed date range.')}
    return res;
  }

    var y=parseYear(v);

    res.value=String(y);
    if(val){var ok=val.t===4?cmp(y,val.op,evalF(val.f1),evalF(val.f2)):cmp(y,val.op,evalF(val.f1),evalF(val.f2));if(!ok)res.msg=val.m||(f.label+' is outside the allowed range.')}

    return res;
  }
  if(c==='AB'&&!isT()){
    var dup=allTanks().some(function(t){if(form.row&&t.row===form.row)return false;if(t.entry&&t.entry.id===form.id)return false;return norm(t.v.AB)===norm(v)});
    if(dup)res.msg=(val&&val.m)||'You have entered a duplicate number.  Please correct.';
    return res;
  }
  if(c==='D'&&isT()){
    var tA=form.v.A,tC=form.v.C;
    var td=tduRows().some(function(t){if(form.row&&t.row===form.row)return false;if(t.entry&&t.entry.id===form.id)return false;return norm(t.v.A)===norm(tA)&&norm(t.v.C)===norm(tC)&&norm(t.v.D)===norm(v)});
    if(td)res.note='A DU with this unit number is already listed for this location and company. It will be added as a further row (a quad DU is two rows).';
    return res;
  }
  if(c==='D'){
    var A=form.v.A,C=form.v.C;
    var d2=allTanks().some(function(t){if(form.row&&t.row===form.row)return false;if(t.entry&&t.entry.id===form.id)return false;return norm(t.v.A)===norm(A)&&norm(t.v.C)===norm(C)&&norm(t.v.D)===norm(v)});
    if(d2)res.note='A tank with this number is already listed for this location and company (twin or triple?). It will be added as a further tank.';
    return res;
  }
  if(c==='A'&&f.combo&&!f.open){
    var inl=(f.list||[]).some(function(x){return norm(x)===norm(v)});
    if(!inl&&!(form.keepA&&norm(form.keepA)===norm(v)))res.msg='Pick the Location from the list. New locations are added in the workbook first.';
    return res;
  }
  return res;
}

function newChoiceCheck(c,text){

  if(/^\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?$/.test(t))return{msg:'Excel would read that as a date. Please add its unit or an extra word, for example 3/4" instead of 3/4.'};

/* ---------- stale-data protection: what changed on the phone, and what the sheet held when the data was loaded ---------- */
function sameVal(f,a,b){

function snapV(v){var o={};Object.keys(v||{}).forEach(function(c){o[c]=v[c]});return o}

}

  var to=t.closest('[data-tdue-open]');if(to){var te2=S.tdue.filter(function(x){return x.id===to.getAttribute('data-tdue-open')})[0];if(te2)openTduEdit(te2.row||(100000+S.tdue.indexOf(te2)));return}
  var tdl=t.closest('[data-tdue-del]');
  if(tdl){var tid=tdl.getAttribute('data-tdue-del');
    if(tdl.getAttribute('data-armed')){S.tdue=S.tdue.filter(function(x){return x.id!==tid});lsSet('ebp_tdue',S.tdue);render();toast('Deleted from this phone.')}
    else{tdl.setAttribute('data-armed','1');tdl.textContent='Tap again to delete';setTimeout(function(){if(tdl.isConnected){tdl.removeAttribute('data-armed');tdl.textContent='Delete'}},3000)}
    return}
  var tdu2=t.closest('[data-tdue-unsend]');if(tdu2){S.tdue.forEach(function(x){if(x.id===tdu2.getAttribute('data-tdue-unsend'))x.sent=0});lsSet('ebp_tdue',S.tdue);render();return}
  if(t.closest('#tduSendBtn')){sendTduNow();return}
  if(t.closest('#sendBtn')){sendNow();return}
  if(t.closest('#loadBtn')){$('#fileIn').click();return}
  if(t.closest('#clearSent')){
    var b=t.closest('#clearSent');
    if(b.getAttribute('data-armed')){S.entries=S.entries.filter(function(x){return!x.sent});lsSet('ebp_entries',S.entries);S.tdue=S.tdue.filter(function(x){return!x.sent});lsSet('ebp_tdue',S.tdue);render();toast('Sent tanks removed.')}
    else{b.setAttribute('data-armed','1');b.textContent='Tap again to remove';setTimeout(function(){if(b.isConnected){b.removeAttribute('data-armed');b.textContent='Remove sent tanks from this phone'}},3000)}
  }
});
document.addEventListener('change',function(e){
  var f3k=e.target.getAttribute&&e.target.getAttribute('data-f3v');
  if(f3k&&S.f2v){f3blur(e.target,f3k);return}
  var f4k=e.target.getAttribute&&e.target.getAttribute('data-f4v');
  if(f4k&&S.f2v){f4blur(e.target,f4k);return}
  if(e.target.id==='f20date'&&S.f2v){(S.f2v.f20||(S.f2v.f20={date:'',res:'',auto:0})).date=e.target.value;f2save();return}
  if(e.target.id==='hoseNew'&&S.form){S.form.hose=e.target.checked;S.form.dirty=true;saveDraft();renderForm();return}
  if(e.target.id==='fileIn'&&e.target.files&&e.target.files[0]){
    var file=e.target.files[0],r=new FileReader();
    r.onload=function(){loadDataText(String(r.result),file.name)};
    r.onerror=function(){toast('That file could not be opened.')};
    r.readAsText(file);e.target.value='';
  }
});
document.addEventListener('input',function(e){
  var f3k=e.target.getAttribute&&e.target.getAttribute('data-f3v');
  if(f3k&&S.f2v){f3dw(S.f2v,f3tab(S.f2v)).vals[f3k]=e.target.value;f2save();return}
  var f5k=e.target.getAttribute&&(e.target.getAttribute('data-f5v')||e.target.getAttribute('data-f5s'));
  if(f5k&&S.f2v){f5store(e.target);f2save();return}
  var f8k=e.target.getAttribute&&e.target.getAttribute('data-f8v');
  if(f8k&&S.f2v){f8store(e.target);f2save();return}
  if(e.target.id==='f13text'&&S.f2v){(S.f2v.f13||(S.f2v.f13={text:''})).text=e.target.value;f2save();f13refresh();return}
  var f4i=e.target.getAttribute&&e.target.getAttribute('data-f4v');
  if(f4i&&S.f2v){f4dw(S.f2v,f4tab(S.f2v)).vals[f4i]=e.target.value;f2save();return}
  var f4m=e.target.getAttribute&&e.target.getAttribute('data-f4cm');
  if(f4m&&S.f2v){var f4b=f4dw(S.f2v,f4tab(S.f2v)),a4=f4b.items[+f4m]||(f4b.items[+f4m]={});a4.c=e.target.value;f2save();return}
  var f3m=e.target.getAttribute&&e.target.getAttribute('data-f3cm');
  if(f3m&&S.f2v){var f3b=f3dw(S.f2v,f3tab(S.f2v)),a3=f3b.items[+f3m]||(f3b.items[+f3m]={});a3.c=e.target.value;f2save();return}
  var fc=e.target.getAttribute&&e.target.getAttribute('data-f2c');
  if(fc&&S.f2v){var fdc=f2dw(S.f2v,f2tab(S.f2v)),a=fdc.items[+fc]||(fdc.items[+fc]={});a.c=e.target.value;f2save();if(S.f2v.tdu)tduLenUpd();return}
  var c=e.target.getAttribute&&e.target.getAttribute('data-in');
  if(c&&S.form){S.form.v[c]=e.target.value;S.form.dirty=true;saveDraft()}
});
document.addEventListener('focusout',function(e){
  var c=e.target.getAttribute&&e.target.getAttribute('data-in');
  if(c&&S.form)blurField(c);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-in')&&S.form){
    e.preventDefault();var els=[].slice.call(document.querySelectorAll('.fields input,.fields .pick'));var i=els.indexOf(e.target);
    if(i>=0&&els[i+1])els[i+1].focus();else e.target.blur();return}
  if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet();
});
function baseTank(row){return S.data.tanks.filter(function(x){return x.row===row})[0]}
function openRow(row){
  var t=baseTank(row);if(!t)return;
  var q=S.entries.filter(function(e){return e.kind==='quick'&&e.row===row&&!e.sent})[0];
  openQuick(t,q);
}
function openFull(row){
  var t=baseTank(row);if(!t)return;
  var e=S.entries.filter(function(x){return x.kind!=='quick'&&x.row===row})[0];
  openForm({id:e?e.id:null,row:t.row,key:keyOf(t.v),v:e?e.v:t.v});
}
function openQuick(t,q){
  var v=q?Object.assign({},q.q,{note:q.note||''}):{};
  S.form={mode:'quick',orig:t.v,id:q?q.id:newId(),row:t.row,key:keyOf(t.v),v:v,hose:q?!!q.hose:false,errs:{},notes:{},dirty:false,page:1,keepA:t.v.A};
  window.scrollTo(0,0);render();
}
var QLAB={R:'PRV expires',S:'PRV psi @ temp',V:'Hose expiry year',X:'Hose length (ft)',Y:'Hose MFG',Z:'HRV expires',AA:'Paint rating (0 - 10)'};
function quickSummary(e){
  var q=e.q||{},p=[];
  ['R','S','Z','AA'].forEach(function(c){if(q[c])p.push(QLAB[c]+' '+q[c])});
  if(e.hose){var h=['V','X','Y'].map(function(c){return q[c]}).filter(Boolean);p.push('New hose'+(h.length?' ('+h.join(', ')+')':''))}
  if(e.note)p.push('Note: '+e.note);
  return p.join(' - ')||'No changes';
}
function openEntry(id){
  var e=S.entries.filter(function(x){return x.id===id})[0];if(!e)return;
  if(e.kind==='quick'){var bt=baseTank(e.row);if(bt)openQuick(bt,e);return}
  if(e.sent&&!e.row){toast('This tank was already sent. Change it in the workbook.');return}
  openForm({id:e.id,row:e.row,key:e.key,v:e.v});
}
